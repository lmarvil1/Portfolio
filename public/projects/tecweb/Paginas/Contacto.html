    <form action="javascript:void(0);" method="post" enctype="text/plain" onsubmit="enviarFormulario()">
        <!-- La expresión javascript:void(0); en el atributo action es una convención que se utiliza cuando
             no deseas que el formulario realice una acción de envío convencional (es decir, cuando no quieres
             que el formulario redireccione a una nueva página o recargue la actual). En lugar de eso, estás
              indicando que deseas ejecutar una instrucción JavaScript, que en este caso es void(0). 
              La función void en JavaScript retorna undefined, y void(0) se usa comúnmente como una forma de
             ejecutar JavaScript sin cambiar la página actual.-->
             
        <!-- Campo 1: Nombre type:text -->
        <div class="form-input">
            <input type="text" id="nombre" name="nombre" required>
            <label for="nombre">Introduzca su nombre</label>
        </div>

        <!-- Campo 2: Apellidos type:text -->
        <div class="form-input">
            <input type="text" id="apellidos" name="apellidos" required>
            <label for="nombre">Introduzca sus apellidos</label>
        </div>

        <!-- Campo 3: email type:email -->
        <div class="form-input">
            <input type="email" id="mail" name="mail" required>
            <label for="nombre">Introduzca su email</label>
        </div>

        <!-- Campo 4: telefono type:tel -->
        <div class="form-input">
            <input type="tel" id="phone" name="phone" required>
            <label for="nombre">Introduzca su teléfono</label>
        </div>

        <!-- Campo 5: mensaje textarea -->
        <div class="form-mensaje">
            <textarea name="msg" id="msg" cols="30" rows="10"></textarea>
            <label for="nombre">Introduzca su mensaje</label>
        </div>

        <!-- Campo 6: ciudad type:list -->
        <div id="data">
        <input list="ciudades" name="ciudad" id="ciudad" required>
        <label for="ciudad">Ciudad</label> 
        <datalist id="ciudades">
            <option value="Alicante">
            <option value="Barcelona">
            <option value="Cáceres">
            <option value="Gerona">
            <option value="Guadalajara">
            <option value="Huelva">
            <option value="Jaén">
            <option value="La Coruña">
            <option value="Lugo">
            <option value="Madrid">
            <option value="Navarra">
            <option value="Palencia">
            <option value="Teruel">
        </datalist>
        </div>
  
        <!-- Campo 7: Tipo de consulta (Radio buttons) -->
        <div id="select">
        <label style="color: rgb(0, 100, 107);">Tipo de consulta: </label>
        <div class="radios">
            <input type="radio" id="compra" name="tipo_consulta" value="compra" required>
            <label for="compra">Compra</label>
        </div>
        <div class="radios">
            <input type="radio" id="venta" name="tipo_consulta" value="venta" required>
            <label for="venta">Venta</label>
        </div>
        <div class="radios">
            <input type="radio" id="alquiler" name="tipo_consulta" value="alquiler" required>
            <label for="alquiler">Alquiler</label><br>
        </div>
        </div>

        <!-- Campo 8: Acepto los términos y condiciones (Checkbox) -->
        <div id="conds">
            <input type="checkbox" id="terms" name="Terminos_y_condiciones" value="terminos" required>
            <label for="terms">He leído la política de privacidad y acepto los términos y condiciones</label>
        </div>

        <div class="form-enviar">
            <input type="submit" value="Enviar" id="boton">
        </div>


        <div id="resultados"></div>

    </form>
